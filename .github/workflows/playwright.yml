name: Playwright Tests
on:
  push:
    branches: [ main, login-test, homepage-test ]
  pull_request:
    branches: [ main, login-test, homepage-test ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: checkout repository
      uses: actions/checkout@v4
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright-Mocha tests
      run: xvfb-run npx mocha mocha-test/specs/**/*.spec.js
    - name: Run Playwright-Cucumber test
      run: xvfb-run npx cucumber-js
    - name: Upload Test Report Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-execution-reports
        
        path: |
          reports/mocha/
          reports/cucumber/
        retention-days: 30
